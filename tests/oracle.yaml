oracle_cases: &oracle_cases
  - id: 1
    description: "SpO2 86, pulse 120, SEVERE_BREATHING_DIFFICULTY"
    input:
      age: 40
      sex: "M"
      pregnant: false
      temp_c: 37.0
      sbp: 120
      dbp: 80
      spo2: 86
      pulse: 120
      symptom_codes: ["SEVERE_BREATHING_DIFFICULTY"]
    expected:
      news2_total: 5
      fired_rule_ids: ["RF-E01", "RF-E02", "NW-U01", "NW-U02"]
      priority: "EMERGENCY"
      flags: ["UNDERSTATED"]
    expected_news2: 5
    expected_priority: "EMERGENCY"
    expected_rules: ["RF-E01", "RF-E02", "NW-U01", "NW-U02"]
    expected_flags: ["UNDERSTATED"]

