rule_set_version: "v1"
clinical_review:
  status: NONE
  reviewer: null
  date: null

age_floor: 16

plausibility:
  age:
    min: 0
    max: 120
  temp_c:
    min: 30.0
    max: 45.0
  sbp:
    min: 40
    max: 300
  dbp:
    min: 20
    max: 200
  spo2:
    min: 50
    max: 100
  pulse:
    min: 20
    max: 250
  rr:
    min: 4
    max: 70
  duration_days:
    min: 0
    max: 365
  free_text_max_length: 300

news2:
  spo2:
    scale_1:
      - { max: 91, score: 3 }
      - { min: 92, max: 93, score: 2 }
      - { min: 94, max: 95, score: 1 }
      - { min: 96, score: 0 }
  sbp:
    - { max: 90, score: 3 }
    - { min: 91, max: 100, score: 2 }
    - { min: 101, max: 110, score: 1 }
    - { min: 111, max: 219, score: 0 }
    - { min: 220, score: 3 }
  pulse:
    - { max: 40, score: 3 }
    - { min: 41, max: 50, score: 1 }
    - { min: 51, max: 90, score: 0 }
    - { min: 91, max: 110, score: 1 }
    - { min: 111, max: 130, score: 2 }
    - { min: 131, score: 3 }
  temp_c:
    - { max: 35.0, score: 3 }
    - { min: 35.1, max: 36.0, score: 1 }
    - { min: 36.1, max: 38.0, score: 0 }
    - { min: 38.1, max: 39.0, score: 1 }
    - { min: 39.1, score: 2 }
  rr:
    - { max: 8, score: 3 }
    - { min: 9, max: 11, score: 1 }
    - { min: 12, max: 20, score: 0 }
    - { min: 21, max: 24, score: 2 }
    - { min: 25, score: 3 }
  alertness:
    A: 0
    C: 3
    V: 3
    P: 3
    U: 3
  on_oxygen:
    true: 2
    false: 0

symptom_codes:
  - CHEST_PAIN
  - SEVERE_BREATHING_DIFFICULTY
  - BREATHING_DIFFICULTY
  - SEIZURE_ONGOING
  - SEVERE_BLEEDING
  - STROKE_SIGNS
  - SNAKEBITE_OR_POISONING
  - PREGNANCY_HEAVY_BLEEDING
  - PREGNANCY_CONVULSION
  - VOMITING_DIARRHOEA_DEHYDRATION
  - FEVER
  - ABDOMINAL_PAIN
  - SEVERE_HEADACHE
  - COUGH
  - OTHER_TEXT

history_codes:
  - DIABETES
  - HYPERTENSION
  - HEART_DISEASE
  - COPD_ASTHMA
  - IMMUNOCOMPROMISED

